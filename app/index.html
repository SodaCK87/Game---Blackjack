<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>21 點</title>
<!-- 分頁圖示直接寫在這裡：沒寫的話瀏覽器會去網站根目錄要 /favicon.ico，在 GitHub Pages 上是 404（tools/check_live.js 抓到的） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23008080'/%3E%3Ctext x='32' y='43' font-size='30' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23f7f4ec'%3E21%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="table"></canvas>
<div id="overlay"></div>
<div id="bubble" class="bubble" hidden></div>
<div id="ver" title="版本號：回報問題時一起告訴對方"></div>
<button id="soundToggle" aria-label="音效" aria-pressed="true" title="音效：開"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M3 9h4l5-4v14l-5-4H3z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="mute" d="M16 9l6 6M22 9l-6 6"/></svg></button>
<div id="fatal" role="alert" hidden></div>
<div id="hud" data-mode="bet">
  <div class="hud-info"><span>籌碼 <b id="bank">0</b></span><span>下注 <b id="bet">0</b></span><button id="oddsToggle" class="toggle" aria-pressed="true">勝率提示：開</button></div>
  <div class="hud-bar" id="betBar">
    <button data-chip="10">+10</button>
    <button data-chip="50">+50</button>
    <button data-chip="100">+100</button>
    <button data-chip="500">+500</button>
    <button data-chip="1000">+1000</button>
    <button data-chip="2000">+2000</button>
    <button id="clearBet" class="ghost">清除</button>
    <button id="dealBtn" class="primary">發牌</button>
  </div>
  <div class="hud-bar" id="brokeBar" hidden>
    <button id="resetBtn" class="primary">重新開始（補回 1,000 籌碼）</button>
  </div>
  <div class="hud-bar" id="actBar" hidden>
    <button id="hitBtn" class="primary">要牌<small class="odds"></small><span class="big" data-label="要牌" aria-hidden="true"></span></button>
    <button id="standBtn" class="primary">停牌<small class="odds"></small><span class="big" data-label="停牌" aria-hidden="true"></span></button>
    <button id="doubleBtn" class="primary">加倍<small class="odds"></small><span class="big" data-label="加倍" aria-hidden="true"></span></button>
    <button id="splitBtn" class="primary" hidden>分牌<small class="odds"></small><span class="big" data-label="分牌" aria-hidden="true"></span></button>
  </div>
</div>
<!-- 一律 classic script、照依賴順序載入：雙擊開啟（file://）時 type="module" 會被擋，守它的是 tests/check_file_protocol.js -->
<script src="lib/three.js"></script>
<script src="js/core/version.js"></script>
<script src="js/core/hand.js"></script>
<script src="js/core/shoe.js"></script>
<script src="js/core/strategy.js"></script>
<script src="js/core/odds.js"></script>
<script src="js/core/game.js"></script>
<script src="js/view/textures.js"></script>
<script src="js/view/cards.js"></script>
<script src="js/view/chips.js"></script>
<script src="js/view/table.js"></script>
<script src="js/view/room.js"></script>
<script src="js/view/dealer.js"></script>
<script src="js/view/anim.js"></script>
<script src="js/view/sfx.js"></script>
<script src="js/view/effects.js"></script>
<script src="js/view/showcase.js"></script>
<script src="js/view/hud.js"></script>
<script src="js/view/director.js"></script>
<script src="js/view/main.js"></script>
</body>
</html>
