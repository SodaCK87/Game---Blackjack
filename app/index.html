<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>21 點</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="table"></canvas>
<div id="overlay"></div>
<div id="bubble" class="bubble" hidden></div>
<div id="banner" hidden></div>
<div id="hud" data-mode="bet">
  <div class="hud-info"><span>籌碼 <b id="bank">0</b></span><span>下注 <b id="bet">0</b></span></div>
  <div class="hud-bar" id="betBar">
    <button data-chip="10">+10</button>
    <button data-chip="50">+50</button>
    <button data-chip="100">+100</button>
    <button data-chip="500">+500</button>
    <button id="clearBet" class="ghost">清除</button>
    <button id="dealBtn" class="primary">發牌</button>
  </div>
  <div class="hud-bar" id="actBar" hidden>
    <button id="hitBtn" class="primary">要牌</button>
    <button id="standBtn" class="primary">停牌</button>
    <button id="doubleBtn" class="primary">加倍</button>
  </div>
</div>
<!-- 一律 classic script、照依賴順序載入：雙擊開啟（file://）時 type="module" 會被擋，守它的是 tests/check_file_protocol.js -->
<script src="lib/three.js"></script>
<script src="js/core/version.js"></script>
<script src="js/core/hand.js"></script>
<script src="js/core/shoe.js"></script>
<script src="js/core/strategy.js"></script>
<script src="js/core/game.js"></script>
<script src="js/view/textures.js"></script>
<script src="js/view/cards.js"></script>
<script src="js/view/chips.js"></script>
<script src="js/view/table.js"></script>
<script src="js/view/dealer.js"></script>
<script src="js/view/anim.js"></script>
<script src="js/view/effects.js"></script>
<script src="js/view/hud.js"></script>
<script src="js/view/director.js"></script>
<script src="js/view/main.js"></script>
</body>
</html>
